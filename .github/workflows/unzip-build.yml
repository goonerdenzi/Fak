
name: Build TWENZI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract TWENZI ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: TWENZI ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          PROJECT=$(find extracted -type f -name project.godot | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip

          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip

          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Install Godot Android Export Templates
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz

          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable

          unzip -q Godot_v4.6.3-stable_export_templates.tpz -d templates

          cp -a templates/templates/. \
            ~/.local/share/godot/export_templates/4.6.3.stable/

          ls -lh ~/.local/share/godot/export_templates/4.6.3.stable/

      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.android

          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.config/godot

          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_password = "android"
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --import \
            --quit

      - name: Build TWENZI APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p builds

          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "Android Debug" \
            builds/TWENZI.apk

          test -s builds/TWENZI.apk

          echo "APK successfully generated"
          ls -lh builds/TWENZI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWENZI-Android-APK
          path: builds/TWENZI.apk
          if-no-files-found: error
          retention-days: 14
