
name: Build TWENZI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TWENZI APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract TWENZI ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: TWENZI ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          PROJECT=$(find extracted -type f -name project.godot | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip

          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip

          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Install Godot Export Templates
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.6.3.stable"

          mkdir -p "$TEMPLATE_DIR"

          unzip -q \
            Godot_v4.6.3-stable_export_templates.tpz \
            -d templates

          cp -a templates/templates/. "$TEMPLATE_DIR/"

          echo "Export templates installed:"
          ls -lh "$TEMPLATE_DIR"

      - name: Create Android Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android Paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_password = "android"
          EOF

      - name: Import TWENZI Project
        shell: bash
        run: |
          set -euo pipefail

          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --import \
            --quit

      - name: Build TWENZI Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mkdir -p builds

          echo "Project directory:"
          pwd

          echo "Build directory:"
          ls -ld builds

          "$GITHUB_WORKSPACE/Godot_v4.6.3-stable_linux.x86_64" \
            --headless \
            --path . \
            --export-debug \
            "Android Debug" \
            builds/TWENZI.apk

          test -s builds/TWENZI.apk

          echo "APK BUILD SUCCESSFUL"
          ls -lh builds/TWENZI.apk

      - name: Upload TWENZI APK
        uses: actions/upload-artifact@v4
        with:
          name: TWENZI-Android-APK
          path: extracted/**/builds/TWENZI.apk
          if-no-files-found: error
          retention-days: 14
