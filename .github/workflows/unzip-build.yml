
name: Build TWENZI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract TWENZI ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "TWENZI ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name project.godot -type f | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "project.godot not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Download Godot 4.6.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable
          unzip -q Godot_v4.6.3-stable_export_templates.tpz -d templates
          cp -a templates/templates/. ~/.local/share/godot/export_templates/4.6.3.stable/

      - name: Configure Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: |
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --editor --path "$PROJECT_DIR" --import

      - name: Build APK
        run: |
          mkdir -p builds
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path "$PROJECT_DIR" --export-debug "Android Debug" builds/TWENZI.apk
          test -s builds/TWENZI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TWENZI-Android-APK
          path: builds/TWENZI.apk
          if-no-files-found: error
